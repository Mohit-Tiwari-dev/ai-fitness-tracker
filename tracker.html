<!DOCTYPE html>
<html>
<head>
<title>Calorie Tracker</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                url('tracker-bg.jpg');
    background-size: cover;
    background-position: center;
    color: white;
}

/* CENTER CARD */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.card {
    background: rgba(15, 23, 42, 0.9);
    padding: 30px;
    border-radius: 20px;
    width: 350px;
    box-shadow: 0 0 25px rgba(34,197,94,0.3);
}

/* TITLE */
h2 {
    text-align: center;
    color: #22c55e;
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #16a34a;
    transform: scale(1.05);
}

/* LIST */
ul {
    margin-top: 15px;
    padding: 0;
}

li {
    list-style: none;
    background: #020617;
    padding: 8px;
    border-radius: 8px;
    margin: 5px 0;
    display: flex;
    justify-content: space-between;
}

/* TOTAL */
.total {
    margin-top: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #22c55e;
}

/* BACK BUTTON */
.back {
    position: absolute;
    top: 20px;
    left: 20px;
    text-decoration: none;
    color: white;
}
</style>

</head>

<body>

<a href="index.html" class="back">⬅ Back</a>

<div class="container">
<div class="card">

<h2>🔥 Calorie Tracker</h2>

<input id="food" placeholder="Enter food (e.g. Banana)">
<input id="cal" type="number" placeholder="Calories">

<button onclick="add()">Add Food</button>
<button onclick="resetAll()">Reset</button>

<ul id="list"></ul>

<div class="total">Total Calories: <span id="total">0</span></div>

</div>
</div>

<script>
let total = 0;

function add() {
    let f = document.getElementById("food").value;
    let c = parseInt(document.getElementById("cal").value);

    if (!f || !c) {
        alert("Enter valid food and calories");
        return;
    }

    total += c;

    let li = document.createElement("li");
    li.innerHTML = `${f} <span>${c} cal ❌</span>`;

    // REMOVE ITEM
    li.onclick = function() {
        total -= c;
        li.remove();
        updateTotal();
    };

    document.getElementById("list").appendChild(li);

    updateTotal();

    // CLEAR INPUTS
    document.getElementById("food").value = "";
    document.getElementById("cal").value = "";
}

function updateTotal() {
    document.getElementById("total").innerText = total;
}

// RESET
function resetAll() {
    total = 0;
    document.getElementById("list").innerHTML = "";
    updateTotal();
}
</script>

</body>
</html>
