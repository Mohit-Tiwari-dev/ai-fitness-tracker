<!DOCTYPE html>
<html>
<head>
<title>Tracker</title>
<style>
body {
    background: url('tracker-bg.jpg');
    background-size: cover;
    color: white;
    padding: 50px;
}
.card {
    background: rgba(0,0,0,0.7);
    padding: 20px;
}
</style>
</head>

<body>

<a href="index.html">⬅ Back</a>

<div class="card">
<h2>Calorie Tracker</h2>

<input id="food" placeholder="Food">
<input id="cal" placeholder="Calories">
<button onclick="add()">Add</button>

<ul id="list"></ul>
<h3 id="total">0</h3>
</div>

<script>
let total=0;
function add(){
let f=food.value;
let c=parseInt(cal.value);
total+=c;

let li=document.createElement("li");
li.innerText=f+"-"+c;
list.appendChild(li);

document.getElementById("total").innerText=total;
}
</script>

</body>
</html>
