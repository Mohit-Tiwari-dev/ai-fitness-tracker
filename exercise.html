<div class="container">
  <h2>🏋️ AI Workout Generator</h2>

  <label>Select Body Part</label>
  <select id="bodyPart">
    <option value="chest">Chest</option>
    <option value="back">Back</option>
    <option value="legs">Legs</option>
    <option value="arms">Arms</option>
    <option value="shoulders">Shoulders</option>
    <option value="abs">Abs</option>
  </select>

  <button onclick="generateWorkout()">Generate Workout</button>

  <div class="result" id="workoutResult"></div>
</div>

<style>
.container {
  max-width: 420px;
  margin: 80px auto;
  padding: 30px;
  background: #0f172a;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 0 25px rgba(34,197,94,0.2);
}

h2 {
  margin-bottom: 20px;
  color: #22c55e;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
}

select {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 20px;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  background: #16a34a;
}

.result {
  margin-top: 20px;
  text-align: left;
  background: #020617;
  padding: 15px;
  border-radius: 12px;
  display: none;
  animation: fadeIn 0.5s ease-in-out;
}

.result h3 {
  color: #22c55e;
}

.result li {
  margin: 8px 0;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

<script>
function generateWorkout() {
  let part = document.getElementById("bodyPart").value;

  let workouts = {
    chest: [
      "Push-ups - 3x12",
      "Bench Press - 4x8",
      "Incline Dumbbell Press - 3x10",
      "Chest Fly - 3x12",
      "Cable Crossover - 3x12"
    ],
    back: [
      "Pull-ups - 3x8",
      "Deadlifts - 4x6",
      "Lat Pulldown - 3x10",
      "Seated Row - 3x12",
      "Face Pull - 3x12"
    ],
    legs: [
      "Squats - 4x8",
      "Lunges - 3x10",
      "Leg Press - 3x12",
      "Hamstring Curl - 3x12",
      "Calf Raises - 3x15"
    ],
    arms: [
      "Bicep Curls - 3x12",
      "Hammer Curls - 3x12",
      "Tricep Dips - 3x10",
      "Tricep Pushdown - 3x12",
      "Close Grip Push-ups - 3x10"
    ],
    shoulders: [
      "Shoulder Press - 4x8",
      "Lateral Raises - 3x12",
      "Front Raises - 3x12",
      "Shrugs - 3x15",
      "Rear Delt Fly - 3x12"
    ],
    abs: [
      "Crunches - 3x15",
      "Plank - 3x30 sec",
      "Leg Raises - 3x12",
      "Russian Twists - 3x20",
      "Mountain Climbers - 3x20"
    ]
  };

  let selectedWorkout = workouts[part];

  // 🔥 Shuffle for AI-like randomness
  selectedWorkout = selectedWorkout.sort(() => 0.5 - Math.random()).slice(0, 4);

  let output = "<h3>💪 Your Workout Plan</h3><ul>";
  selectedWorkout.forEach(ex => {
    output += `<li>✔ ${ex}</li>`;
  });
  output += "</ul>";

  let resultDiv = document.getElementById("workoutResult");
  resultDiv.style.display = "block";
  resultDiv.innerHTML = output;
}
</script>
