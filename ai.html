<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Fitness Engine</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
              url('background.jpg') no-repeat center/cover;
  color: white;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: rgba(0,0,0,0.7);
  padding: 20px;
  border-radius: 10px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
}

button {
  background: limegreen;
  border: none;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🧠 AI Fitness Recommendation</h2>

  <input type="number" id="age" placeholder="Age">
  <input type="number" id="height" placeholder="Height (cm)">
  <input type="number" id="weight" placeholder="Weight (kg)">

  <select id="goal">
    <option value="fat">Fat Loss</option>
    <option value="muscle">Muscle Gain</option>
    <option value="maintain">Maintain</option>
  </select>

  <select id="activity">
    <option value="1.2">Low Activity</option>
    <option value="1.4">Moderate</option>
    <option value="1.7">High</option>
  </select>

  <button onclick="aiEngine()">Generate AI Plan</button>

  <div id="result" class="result" style="display:none;"></div>
</div>

<script>
function aiEngine() {
  let age = +document.getElementById("age").value;
  let height = +document.getElementById("height").value;
  let weight = +document.getElementById("weight").value;
  let goal = document.getElementById("goal").value;
  let activity = +document.getElementById("activity").value;

  if (!age || !height || !weight) {
    alert("Fill all fields");
    return;
  }

  // 🔥 Smart scoring system (AI-like thinking)
  let fitnessScore = (weight / (height/100)**2); // BMI
  let intensity = fitnessScore > 25 ? "high" : fitnessScore < 18 ? "low" : "medium";

  // 🔥 Dynamic calorie engine
  let baseCalories = weight * 24 * activity;

  let adjustment = {
    fat: -500,
    muscle: +400,
    maintain: 0
  };

  let calories = Math.round(baseCalories + adjustment[goal]);

  // 🔥 Exercise pool (randomized AI feel)
  const exercises = {
    fat: ["Burpees", "Mountain Climbers", "Jump Rope", "HIIT Sprints", "Cycling"],
    muscle: ["Bench Press", "Squats", "Deadlifts", "Pull-ups", "Shoulder Press"],
    maintain: ["Jogging", "Push-ups", "Yoga", "Light Weights", "Swimming"]
  };

  // Pick 3 random exercises
  let selected = exercises[goal]
    .sort(() => 0.5 - Math.random())
    .slice(0, 3);

  // 🔥 Adaptive workout style
  let workoutStyle = "";
  if (intensity === "high") {
    workoutStyle = "🔥 High intensity training with short rest";
  } else if (intensity === "low") {
    workoutStyle = "🧘 Light training focusing on form and recovery";
  } else {
    workoutStyle = "💪 Balanced strength and cardio routine";
  }

  // 🔥 Smart diet generator
  const dietIdeas = [
    "Include protein in every meal",
    "Drink 3-4L water daily",
    "Avoid processed sugar",
    "Eat more whole foods",
    "Track your calories"
  ];

  let diet = dietIdeas.sort(() => 0.5 - Math.random()).slice(0, 3);

  // 🔥 AI personality message
  let message = "";
  if (goal === "fat") message = "You are in fat-loss mode. Consistency is key 🔥";
  if (goal === "muscle") message = "Time to build muscle. Lift heavy 💪";
  if (goal === "maintain") message = "Stay fit and consistent ⚡";

  // OUTPUT
  let output = `
    <h3>Your Smart AI Plan</h3>

    <p><b>Calories:</b> ${calories} kcal/day</p>

    <p><b>Workout Style:</b> ${workoutStyle}</p>

    <p><b>Exercises:</b></p>
    <ul>${selected.map(e => `<li>${e}</li>`).join("")}</ul>

    <p><b>Diet Tips:</b></p>
    <ul>${diet.map(d => `<li>${d}</li>`).join("")}</ul>

    <p><b>AI Coach Says:</b> ${message}</p>
  `;

  let resultDiv = document.getElementById("result");
  resultDiv.style.display = "block";
  resultDiv.innerHTML = output;
}
</script>

</body>
</html>
